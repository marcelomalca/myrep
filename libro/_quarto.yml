project:
  type: book
  output-dir: _book

lang: es

book:
  title: "Precio del oro y bienestar en los distritos con yacimientos de oro del Perú, 2014–2025"
  subtitle: "Bases de datos"
  author: "Marcelo Malca"
  date: last-modified
  date-format: "D [de] MMMM [de] YYYY"
  search: true
  chapters:
    - index.qmd
    - yacimientos.qmd
    - precio_oro.qmd
    - enaho.qmd
    - delincuencia.qmd
    - grupos.qmd
    - ampliaciones.qmd
    - referencias.qmd

bibliography:
  - ../informe/referencias.bib
  - referencias_enaho.bib
  - referencias_delincuencia.bib

crossref:
  lof-title: "Índice de figuras y mapas"
  lot-title: "Índice de tablas"

execute:
  warning: false
  message: false

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: "En este capítulo"
    code-fold: true
    code-summary: "Ver código"
    fig-dpi: 150
    tbl-cap-location: top
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    fontfamily: fontspec
    mainfont: Latin Modern Roman
    sansfont: Latin Modern Sans
    monofont: Latin Modern Mono
    papersize: a4
    geometry:
      - margin=2cm
    toc: true
    toc-depth: 2
    toc-title: "Índice"
    lof: true
    lot: true
    echo: false
    callout-icon: false
    fig-dpi: 200
    tbl-cap-location: top
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{etoolbox}
        \AtBeginEnvironment{longtable}{\scriptsize}
